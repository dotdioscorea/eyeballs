name: Requota
options:
  bundleIdPrefix: com.dotdioscorea
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: SCH97XTQGY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Requota:
    type: application
    platform: iOS
    sources: [App/Requota, Shared]
    entitlements:
      path: App/Requota/Requota.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dotdioscorea.eyeballs]
    info:
      path: App/Requota/Info.plist
      properties:
        CFBundleDisplayName: Requota
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.dotdioscorea.eyeballs.refresh, com.dotdioscorea.eyeballs.processing]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [requota, eyeballs]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotdioscorea.eyeballs
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RequotaWidgets
        embed: true
  RequotaWidgets:
    type: app-extension
    platform: iOS
    sources: [App/RequotaWidgets, Shared]
    entitlements:
      path: App/RequotaWidgets/RequotaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dotdioscorea.eyeballs]
    info:
      path: App/RequotaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Requota
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BGTaskSchedulerPermittedIdentifiers: [com.dotdioscorea.eyeballs.refresh, com.dotdioscorea.eyeballs.processing]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotdioscorea.eyeballs.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  RequotaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: Requota}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dotdioscorea.eyeballs.tests
  RequotaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: Requota}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dotdioscorea.eyeballs.uitests
schemes:
  Requota:
    build:
      targets:
        Requota: all
    test:
      targets: [RequotaTests, RequotaUITests]
    archive:
      config: Release
